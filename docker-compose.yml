# Train Control on a Docker host. Start it with: docker compose up -d
services:
  train-control:
    # "latest" is the newest release; use "main" for the newest build before a release exists.
    image: ghcr.io/jsttylr/train-control:latest
    container_name: train-control
    restart: unless-stopped
    ports:
      - "8070:8070"
    volumes:
      - train-control-data:/data   # the roster survives updates

volumes:
  train-control-data:
